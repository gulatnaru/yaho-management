# Preview-only official Prisma migrate deploy for the POLICY guidance-audit CHECK migration.
# CI-BRANCH VERSION. Prepared 2026-11-19 under the approved POLICY registration SHIP scope (step 1).
# Dispatch/deploy is a separate approval (approved 2026-11-19 23:31 KST, Preview 3 items);
# reviewed registration HEAD 3d32c37 (parent 4d71f09).
# Target path on the CI branch:
#   .github/workflows/preview-outbox-migrate.yml
# (NOT a new workflow name.) WHY THIS PATH: GitHub workflow_dispatch can only be
# triggered for a workflow whose file exists on the default branch. The path
# preview-outbox-migrate.yml already exists on default (workflow ID 397767921,
# state active), so dispatching that path with --ref ci-preview-oq16-policy-migrate
# resolves, and the run uses THIS branch's version of the file. A new file existing
# only on a branch is NOT dispatchable. Main's file is NEVER modified by this branch,
# and this branch must NEVER be merged to main (merging would overwrite main's
# outbox workflow). Delete this branch after the migration.
# Manual execution ONLY (workflow_dispatch). Never auto-triggered.
# Target: Preview Supabase project ONLY, verified by parsed project ref before any DB touch.
# Secrets referenced by NAME only (values never printed, never stored in this file):
#   PREVIEW_DIRECT_URL   - Preview Direct/Session-pooler connection string
#   PREVIEW_PROJECT_REF  - expected Preview project ref (registered as a repo secret)
# The POLICY migration file is embedded EXACTLY from reviewed registration HEAD 3d32c37. Before deploy, its sha256 hash is verified
# against the approved value; any mismatch aborts the run. The base tree is
# the verified main tip 749f29d97b6a6df2ce89f556c0154909c380ead6
# (git ls-remote verified during this SHIP on 2026-11-19 UTC). NOTE: actions/checkout
# uses the pinned main-tip SHA as the ref (same as the G2/G3/G4/P0/OQ-16/P-1/D2/CHECK CI
# precedents, whose runs succeeded). The migration SQL is inline because the
# registration branch is NOT merged before the migration, so the runner cannot check
# it out. ONE migration is applied in ONE run
# (20261119131754 AiServiceGuidanceAudit CHECK +POLICY); the preflight asserts pending is
# EXACTLY that one migration. Prisma applies pending migrations in timestamp
# order; with a single pending migration there is no ordering question.
# Prisma is pinned to 6.19.3 via npx (the isolated-verified version); no npm ci
# is needed because migrate/db-execute do not require the repo's node_modules.
# The CI branch also carries a vercel.json gate
# (deploymentEnabled: {"ci-preview-oq16-policy-migrate": false})
# so the push itself creates no Vercel deployment.
# DO NOT MERGE without an explicit merge decision (and never merge this branch).
name: ci-preview-oq16-policy-migrate

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target Supabase project name (must be yaho-preview)"
        required: true
        default: "yaho-preview"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-preview-oq16-policy-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "749f29d97b6a6df2ce89f556c0154909c380ead6"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write POLICY migration file (reviewed content, hash-checked)
        run: |
          set -euo pipefail
          mkdir -p prisma/migrations/20261119131754_ai_service_guidance_policy_audit
          cat > prisma/migrations/20261119131754_ai_service_guidance_policy_audit/migration.sql << 'OQ16_POLICY_MIGRATION_SQL'
          ALTER TABLE "AiServiceGuidanceAudit"
            DROP CONSTRAINT "ai_service_guidance_audit_values";

          ALTER TABLE "AiServiceGuidanceAudit"
            ADD CONSTRAINT "ai_service_guidance_audit_values"
            CHECK ("environment" IN ('PREVIEW','PRODUCTION')
              AND "topic" IN ('PREPARATION','RAIN','POLICY'));
          OQ16_POLICY_MIGRATION_SQL
          echo "68d98b531f16df198d3dd4fdbdfa5b3188943cb11461b72aeb5f4fb212f1fb07  prisma/migrations/20261119131754_ai_service_guidance_policy_audit/migration.sql" > /tmp/oq16-policy-migration-checksums.txt
          sha256sum -c /tmp/oq16-policy-migration-checksums.txt
      - name: Pre-connection target guard (Preview only, no DB touch)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          EXPECTED_REF: ${{ secrets.PREVIEW_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Never print DATABASE_URL, EXPECTED_REF, or any parsed value.
          # GitHub masks registered secrets in logs; this script echoes none of them.
          # 1) Dispatcher must declare the target project name.
          if [ "${{ inputs.target }}" != "yaho-preview" ]; then
            echo "ABORT: target input is not yaho-preview"
            exit 1
          fi
          # 2) Parse host, port, and username from the URL (no DB touch).
          URL_NO_SCHEME="${DATABASE_URL#*://}"
          USERINFO="${URL_NO_SCHEME%%@*}"
          USERNAME="${USERINFO%%:*}"
          HOSTPORT="${URL_NO_SCHEME##*@}"
          HOST="${HOSTPORT%%:*}"
          PORT="${HOSTPORT##*:}"
          PORT="${PORT%%/*}"
          # 3) Port must be 5432: Direct or Session pooler only.
          # Transaction pooler (6543) is incompatible with migrate deploy.
          if [ "$PORT" != "5432" ]; then
            echo "ABORT: port is not 5432 (Direct/Session only; Transaction pooler excluded)"
            exit 1
          fi
          # 4) Parse the project ref from the direct hostname and/or pooler username.
          # Substring matching is NOT used: the actual parsed hostname/username is compared.
          REF_FROM_HOST=""
          REF_FROM_USER=""
          case "$HOST" in
            db.*.supabase.co)
              REF_FROM_HOST="${HOST#db.}"
              REF_FROM_HOST="${REF_FROM_HOST%.supabase.co}"
              ;;
            *.pooler.supabase.com)
              ;;
            *)
              echo "ABORT: host is not a Supabase direct or pooler host"
              exit 1
              ;;
          esac
          case "$USERNAME" in
            postgres.*)
              REF_FROM_USER="${USERNAME#postgres.}"
              ;;
            postgres)
              ;;
            *)
              echo "ABORT: username is not a Supabase postgres user"
              exit 1
              ;;
          esac
          if [ -n "$REF_FROM_HOST" ] && [ -n "$REF_FROM_USER" ] && [ "$REF_FROM_HOST" != "$REF_FROM_USER" ]; then
            echo "ABORT: inconsistent project ref between host and username"
            exit 1
          fi
          PARSED_REF="${REF_FROM_HOST:-$REF_FROM_USER}"
          if [ -z "$PARSED_REF" ]; then
            echo "ABORT: cannot parse project ref from connection URL"
            exit 1
          fi
          # 5) Accept ONLY the approved Preview project ref; everything else
          # (including the Production project) is rejected by construction.
          # A missing EXPECTED_REF also aborts here (empty never equals a ref).
          if [ "$PARSED_REF" != "$EXPECTED_REF" ]; then
            echo "ABORT: target project ref mismatch (not the approved Preview project)"
            exit 1
          fi
          echo "Pre-connection guard passed: target yaho-preview, Preview project ref match, port 5432"
      - name: Preflight (Preview only, read-only checks)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          set -euo pipefail
          # A) Read-only preflight: no failed/incomplete, POLICY migration not
          # present, applied exactly 30, diag table present and empty, Config v5 paused, Request 0,
          # KnowledgeEntry 2 (PREPARATION/RAIN), GuidanceAudit 2.
          # Decided by exit code only: the DO block raises on any mismatch.
          if ! npx --yes prisma@6.19.3 db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM "_prisma_migrations" WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL) THEN
              RAISE EXCEPTION 'failed or incomplete migration exists';
            END IF;
            IF EXISTS (SELECT 1 FROM "_prisma_migrations" WHERE migration_name = '20261119131754_ai_service_guidance_policy_audit') THEN
              RAISE EXCEPTION 'policy migration already present';
            END IF;
            IF (SELECT COUNT(*) FROM "_prisma_migrations") <> 30 THEN
              RAISE EXCEPTION 'applied count is not 30';
            END IF;
            IF to_regclass('public."AiServiceSkillDiag"') IS NULL THEN
              RAISE EXCEPTION 'AiServiceSkillDiag missing (D2 not applied)';
            END IF;
            IF (SELECT COUNT(*) FROM "AiServiceSkillDiag") <> 0 THEN
              RAISE EXCEPTION 'AiServiceSkillDiag is not empty';
            END IF;
            IF (SELECT COUNT(*) FROM "AiServiceConfig") <> 1 OR
               (SELECT COUNT(*) FROM "AiServiceConfig" WHERE environment = 'PREVIEW' AND version = 5 AND paused = true) <> 1 THEN
              RAISE EXCEPTION 'AiServiceConfig is not Preview v5 paused';
            END IF;
            IF (SELECT COUNT(*) FROM "AiServiceRequest") <> 0 THEN
              RAISE EXCEPTION 'AiServiceRequest is not empty';
            END IF;
            IF (SELECT COUNT(*) FROM "AiServiceKnowledgeEntry") <> 2 THEN
              RAISE EXCEPTION 'AiServiceKnowledgeEntry is not 2';
            END IF;
            IF (SELECT COUNT(*) FROM "AiServiceGuidanceAudit") <> 2 THEN
              RAISE EXCEPTION 'AiServiceGuidanceAudit is not 2';
            END IF;
          END $$;
          SQL
          then
            echo "ABORT: preflight failed (see command error above)"
            exit 1
          fi
          # B) Prisma-native status classification.
          # Prisma 6.19.3 status exits 1 for BOTH pending and errors, so the exit code
          # alone cannot distinguish them; the output must be classified.
          # Orphans (applied rows present in DB but not in this checkout) are listed
          # in a SEPARATE section, so a global grep would wrongly abort: parse ONLY
          # the pending section.
          STATUS_FILE="$(mktemp)"
          STATUS_EXIT=0
          npx --yes prisma@6.19.3 migrate status --schema prisma/schema.prisma > "$STATUS_FILE" 2>&1 || STATUS_EXIT=$?
          echo "--- migrate status output (migration names only, no secrets) ---"
          cat "$STATUS_FILE"
          echo "--- end status output ---"
          if [ "$STATUS_EXIT" -eq 0 ]; then
            echo "ABORT: status reports up to date (no pending) - policy migration already applied or unexpected state"
            exit 1
          fi
          # With ONE pending migration Prisma prints the singular form; with more
          # it prints the plural. Match either verb form.
          if ! grep -qE '(have|has) not yet been applied' "$STATUS_FILE"; then
            if grep -qE 'Error:|P[0-9]{4}|Can'"'"'t|cannot|drift|checksum' "$STATUS_FILE"; then
              echo "ABORT: migrate status errored (connection, schema, or drift) - no deploy attempted"
            else
              echo "ABORT: status output format unexpected (no pending section header)"
            fi
            exit 1
          fi
          # Take only migration-name lines (strip leading whitespace); the orphan
          # section follows the pending section after a blank line, and the awk
          # exits at that blank line. Only timestamp-named lines are printed.
          PENDING="$(awk '/(have|has) not yet been applied:/{flag=1; next} flag && /^$/{exit} flag {gsub(/^[[:space:]]+/, ""); if ($0 ~ /^[0-9]{14}_/) print}' "$STATUS_FILE")"
          echo "PENDING=[$PENDING]"
          EXPECTED_PENDING="20261119131754_ai_service_guidance_policy_audit"
          if [ "$PENDING" != "$EXPECTED_PENDING" ]; then
            echo "ABORT: pending is not exactly the POLICY migration"
            exit 1
          fi
          echo "Preflight passed: applied 30, pending exactly the POLICY migration, failed 0, diag present empty, Config v5 paused, Request 0, KnowledgeEntry 2, GuidanceAudit 2"
      - name: Official migrate deploy (Preview only)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          set -euo pipefail
          npx --yes prisma@6.19.3 migrate deploy --schema prisma/schema.prisma
          POST_FILE="$(mktemp)"
          POST_EXIT=0
          npx --yes prisma@6.19.3 migrate status --schema prisma/schema.prisma > "$POST_FILE" 2>&1 || POST_EXIT=$?
          if [ "$POST_EXIT" -ne 0 ] || ! grep -q 'up to date' "$POST_FILE"; then
            echo "ABORT: post-deploy status is not up to date"
            exit 1
          fi
          echo "Deploy complete: post-deploy status is up to date"
      - name: Post-apply verification (DO block, exit code decides)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          set -euo pipefail
          # Decided by exit code only: the DO block raises on any mismatch.
          if ! npx --yes prisma@6.19.3 db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          DECLARE
            v_count integer;
            v_check text;
            v_def text;
            v_audit_before integer;
          BEGIN
            SELECT COUNT(*) INTO v_count FROM "_prisma_migrations";
            IF v_count <> 31 THEN RAISE EXCEPTION 'verification failed: total'; END IF;
            SELECT COUNT(*) INTO v_count FROM "_prisma_migrations" WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL;
            IF v_count <> 0 THEN RAISE EXCEPTION 'verification failed: failed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261119131754_ai_service_guidance_policy_audit';
            IF v_check <> '68d98b531f16df198d3dd4fdbdfa5b3188943cb11461b72aeb5f4fb212f1fb07' THEN RAISE EXCEPTION 'verification failed: policy checksum'; END IF;
            SELECT COUNT(*) INTO v_count FROM "_prisma_migrations" WHERE migration_name = '20261119131754_ai_service_guidance_policy_audit' AND finished_at IS NOT NULL AND rolled_back_at IS NULL;
            IF v_count <> 1 THEN RAISE EXCEPTION 'verification failed: policy history'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261118000000_add_ai_service_skill_diag';
            IF v_check <> 'ba08f59b286c05825a93e06e027a2e62e8419cba89a8cebd066ae5364c502e8d' THEN RAISE EXCEPTION 'verification failed: d2 checksum changed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261118152914_ai_service_audit_diag_purge';
            IF v_check <> 'fb1d714d4a5f0ba27ef8a5e751f67aaf1929fd0f1d7d16da5214216cdf776987' THEN RAISE EXCEPTION 'verification failed: check checksum changed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261115160000_ai_service_audit_emergency_pause';
            IF v_check <> 'f18237d109d4e2e5f8573eb7697c5b21efad5444a6e5f6b7666ba7bbf2d476db' THEN RAISE EXCEPTION 'verification failed: emergency-pause checksum changed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261115170000_ai_service_audit_seq';
            IF v_check <> '1c46547c3dddc1d873fdab055318d8ada4cd2da0d0a446c2ddcb9ef0a218c8f1' THEN RAISE EXCEPTION 'verification failed: seq checksum changed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261112090000_ai_service_deletion_audit';
            IF v_check <> 'e4514cc1880398aaf975b8b10e8ac4b3dfa2e744c28f822cbe4c94ac29ac35d1' THEN RAISE EXCEPTION 'verification failed: deletion_audit checksum changed'; END IF;
            SELECT checksum INTO v_check FROM "_prisma_migrations" WHERE migration_name = '20261112161600_ai_service_guidance_audit';
            IF v_check <> 'bd186e5a5d3d254af3bdf87f0caaad03c1b7dca5394e00f3f2f9ab7f8e6a159a' THEN RAISE EXCEPTION 'verification failed: guidance-audit checksum changed'; END IF;
            SELECT pg_get_constraintdef(oid) INTO v_def FROM pg_constraint WHERE conname = 'ai_service_guidance_audit_values' AND contype = 'c';
            IF v_def IS NULL OR v_def NOT LIKE '%POLICY%' OR v_def NOT LIKE '%PREPARATION%' OR v_def NOT LIKE '%RAIN%' THEN RAISE EXCEPTION 'verification failed: guidance check constraint'; END IF;
            SELECT COUNT(*) INTO v_audit_before FROM "AiServiceGuidanceAudit";
            BEGIN
              INSERT INTO "AiServiceGuidanceAudit" ("id","environment","topic","version","contentSha256","actorId") VALUES ('policy-probe','PREVIEW','POLICY',1,'6fac3ee24c783017d897bc90f452cc6ae8279aa889f99ef51e45d7e1e2c2e748','policy-probe');
              RAISE EXCEPTION 'probe-rollback';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM <> 'probe-rollback' THEN RAISE EXCEPTION 'verification failed: CHECK rejects POLICY: %', SQLERRM; END IF;
            END;
            BEGIN
              INSERT INTO "AiServiceGuidanceAudit" ("id","environment","topic","version","contentSha256","actorId") VALUES ('policy-probe-bad','PREVIEW','NOT_A_LISTED_TOPIC',1,'6fac3ee24c783017d897bc90f452cc6ae8279aa889f99ef51e45d7e1e2c2e748','policy-probe');
              RAISE EXCEPTION 'verification failed: CHECK accepted an unlisted topic';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
            SELECT COUNT(*) INTO v_count FROM "AiServiceGuidanceAudit";
            IF v_count <> v_audit_before THEN RAISE EXCEPTION 'verification failed: audit row count changed by probe'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceKnowledgeEntry";
            IF v_count <> 2 THEN RAISE EXCEPTION 'verification failed: KnowledgeEntry count'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceKnowledgeEntry" WHERE environment = 'PREVIEW' AND topic = 'PREPARATION' AND approved = true AND version = 1 AND length("content") = 269 AND octet_length("content") = 593;
            IF v_count <> 1 THEN RAISE EXCEPTION 'verification failed: PREPARATION original'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceKnowledgeEntry" WHERE environment = 'PREVIEW' AND topic = 'RAIN' AND approved = true AND version = 1 AND length("content") = 385 AND octet_length("content") = 932;
            IF v_count <> 1 THEN RAISE EXCEPTION 'verification failed: RAIN original'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceGuidanceAudit";
            IF v_count <> 2 THEN RAISE EXCEPTION 'verification failed: GuidanceAudit count changed'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceConfig";
            IF v_count <> 1 THEN RAISE EXCEPTION 'verification failed: Config count changed'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceConfig" WHERE environment = 'PREVIEW' AND version = 5 AND paused = true;
            IF v_count <> 1 THEN RAISE EXCEPTION 'verification failed: Config version or pause changed'; END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceRequest";
            IF v_count <> 0 THEN RAISE EXCEPTION 'verification failed: AiServiceRequest not empty'; END IF;
            IF to_regclass('public."AiServiceSkillDiag"') IS NULL THEN
              RAISE EXCEPTION 'verification failed: diag table missing';
            END IF;
            SELECT COUNT(*) INTO v_count FROM "AiServiceSkillDiag";
            IF v_count <> 0 THEN RAISE EXCEPTION 'verification failed: diag not empty'; END IF;
          END $$;
          SQL
          then
            echo "ABORT: post-apply verification failed (see command error above)"
            exit 1
          fi
          echo "Post-apply verification passed: 31 history rows, POLICY checksum, D2/CHECK/P-1 checksums unchanged, guidance CHECK accepts POLICY and rejects unlisted topic (probe rolled back, audit count unchanged), KnowledgeEntry 2 (PREPARATION/RAIN originals intact), GuidanceAudit 2, Config v5 paused unchanged, Request 0, diag empty"
      - name: Failure diagnostic (runs only on failure)
        if: failure()
        run: |
          echo "Deploy did not complete. Do NOT re-run or resolve without review."
          echo "Check _prisma_migrations for failed rows (finished_at NULL) and inspect the failed step's log."
          echo "A failed migration blocks later deploys (P3009) until its state is reviewed."
          echo "No data was modified by this diagnostic step."
