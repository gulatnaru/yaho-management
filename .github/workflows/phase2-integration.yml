name: Phase 2 PostgreSQL Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yaho_e2e
          POSTGRES_USER: yaho_e2e
          POSTGRES_PASSWORD: ci-synthetic-e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U yaho_e2e -d yaho_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://yaho_e2e:ci-synthetic-e2e@127.0.0.1:55432/yaho_e2e
      DIRECT_URL: postgresql://yaho_e2e:ci-synthetic-e2e@127.0.0.1:55432/yaho_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Verify PostgreSQL
        run: npx tsx scripts/ci/verify-e2e-db.ts

      - name: Prepare ephemeral database roles
        run: npx tsx scripts/ci/prepare-e2e-db.ts

      - name: Apply migrations to ephemeral database
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts

  obs01-perf:
    needs: integration
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') &&
      github.event.pull_request.number == 54 &&
      github.event.pull_request.head.ref == 'feature/phase21-ai-service' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: obs01-perf-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yaho_e2e
          POSTGRES_USER: yaho_e2e
          POSTGRES_PASSWORD: ci-synthetic-e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U yaho_e2e -d yaho_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://yaho_e2e:ci-synthetic-e2e@127.0.0.1:55432/yaho_e2e
      DIRECT_URL: postgresql://yaho_e2e:ci-synthetic-e2e@127.0.0.1:55432/yaho_e2e
      OBS01_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OBS01_INTEGRATION_SHA: ${{ github.sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prepare isolated performance database
        env:
          YAHO_OBS01_PERF: '1'
        run: npx --no-install tsx tests/performance/support/run-guarded.ts --prepare-db

      - name: Measure OBS-01 and publish aggregate summary
        id: measure
        env:
          YAHO_OBS01_PERF: '1'
        run: npx --no-install tsx tests/performance/support/run-guarded.ts

      - name: Report setup failure without measurement
        if: ${{ failure() && steps.measure.outcome == 'skipped' }}
        run: |
          summary='OBS01 status=NOT RUN reason=SETUP planned_cells=50 primary_calls=0 n=0 statistics=N/A calibration=NOT RUN cleanup=UNKNOWN'
          printf '%s\n' "$summary"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
