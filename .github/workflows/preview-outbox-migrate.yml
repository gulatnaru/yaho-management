# DRAFT — NOT COMMITTED — NO SECRETS IN THIS FILE
# Purpose: official `prisma migrate deploy` for the Preview project only,
# executed by GitHub Actions using a user-stored repository secret.
# The secret itself is created by the user in the GitHub web console;
# this file contains only the secret NAME, never a value.
#
# Execution-time placement (not now): commit to branch test/kakao-outbox-pg,
# then dispatch with: gh workflow run preview-outbox-migrate --ref test/kakao-outbox-pg
# Triggers: workflow_dispatch ONLY. No push, no pull_request triggers.

name: preview-outbox-migrate

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/kakao-outbox-pg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Guard + official migrate deploy (Preview only)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          set -euo pipefail
          # Never print DATABASE_URL or DIRECT_URL. GitHub masks registered
          # secrets in logs, and this script never echoes them.
          # Guard: pending must be exactly the outbox migration, nothing else.
          STATUS_BEFORE="$(npx prisma migrate status --schema prisma/schema.prisma || true)"
          PENDING="$(echo "$STATUS_BEFORE" | grep -E '^[0-9]{14}_' || true)"
          if [ "$PENDING" != "20261026090000_notification_outbox" ]; then
            echo "ABORT: pending is not exactly the outbox migration"
            echo "$STATUS_BEFORE" | grep -E '^[0-9]{14}_' || true
            exit 1
          fi
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma migrate status --schema prisma/schema.prisma
      - name: Post-apply read-only verification
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          set -euo pipefail
          npx prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'NotificationOutbox';
          SELECT typname FROM pg_type WHERE typname = 'NotificationOutboxStatus';
          SELECT indexname FROM pg_indexes
            WHERE schemaname = 'public' AND tablename = 'NotificationOutbox'
            ORDER BY indexname;
          SELECT relname, relrowsecurity FROM pg_class
            WHERE relname = 'NotificationOutbox';
          SELECT policyname, roles FROM pg_policies
            WHERE schemaname = 'public' AND tablename = 'NotificationOutbox';
          SELECT migration_name, finished_at, rolled_back_at
            FROM "_prisma_migrations"
            WHERE migration_name = '20261026090000_notification_outbox';
          SQL
